[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "aerobat"
version = "1.0.0"
description = "Automated behavioral research for language-model agents"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "litellm==1.80.16",
  "matplotlib==3.10.0",
  "numpy==2.2.6",
  "pandas==2.3.3",
  "PyYAML==6.0.1",
  "scipy==1.15.3",
  "seaborn==0.13.2",
]

[project.optional-dependencies]
notebooks = ["jupyter==1.1.1", "nest_asyncio==1.6.0"]

[tool.setuptools.packages.find]
where = ["src"]
